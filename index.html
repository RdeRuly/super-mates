<body>
<main class="wrap">
 <div class="brand-icon" aria-hidden="true">✦</div><h1 class="brand">¡SUPER <span>MATES!</span></h1><p class="sub">Aprender jugando es una aventura.</p>
 <section id="home" class="card"><h2 class="title">¿Qué practicamos hoy?</h2><div class="operations"><button class="op" data-op="+"><span>+</span>Sumas</button><button class="op" data-op="−"><span>−</span>Restas</button><button class="op" data-op="×"><span>×</span>Multiplicaciones</button><button class="op" data-op="÷"><span>÷</span>Divisiones</button></div></section>
 <section id="setup" class="card hidden"><button class="back" id="backHome">← Volver</button><h2 class="title" id="setupTitle">Preparar partida</h2><p>Elige las cifras de cada número:</p><div class="fields"><div><label class="fieldlabel" for="digitsA">Primer número</label><select id="digitsA"><option value="1">1 cifra</option><option value="2">2 cifras</option><option value="3">3 cifras</option><option value="4">4 cifras</option></select></div><div><label class="fieldlabel" for="digitsB">Segundo número</label><select id="digitsB"><option value="1">1 cifra</option><option value="2">2 cifras</option><option value="3">3 cifras</option><option value="4">4 cifras</option></select></div></div><p id="hint" class="help"></p><button class="primary" id="start">¡Vamos a jugar!</button></section>
 <section id="game" class="card hidden"><div class="topline"><button class="back" id="backSetup">← Cambiar nivel</button><span class="counter" id="score">✓ 0 aciertos</span></div><div class="question" id="question" aria-live="polite"></div><div class="answers" id="answers"></div><div id="feedback" class="feedback" aria-live="polite"></div></section>
 
</main>
<dialog id="celebrate" class="celebrate" aria-labelledby="congrats">
<div class="confetti" aria-hidden="true">✦ · ★ · ✦</div><div class="medal" aria-hidden="true">🏆</div>
<h2 id="congrats"></h2>
<button class="primary next" id="continue">QUIERO SEGUIR APRENDIENDO →</button>
</dialog>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const labels={'+':'Sumas','−':'Restas','×':'Multiplicaciones','÷':'Divisiones'};
const messages=["¡Sigue así, María, lo estás haciendo genial!","¡Muy bien, María! ¡Eres increíble!","¡María, cada día lo haces mejor!","¡Qué bien lo estás haciendo, María!","¡María, eres una auténtica campeona!","¡Fantástico, María! ¡Sigue aprendiendo!","¡María, estoy muy orgulloso de ti!","¡Lo estás bordando, María!","¡María, no hay quien te pare!","¡Increíble, María! ¡Sigue así!","¡María, tienes una mente brillante!","¡Qué maravilla, María! ¡Lo has conseguido!","¡María, estás aprendiendo muchísimo!","¡Sigue brillando, María!","¡María, eres una máquina de aprender!","¡Impresionante, María! ¡Qué bien lo haces!","¡María, vas por muy buen camino!","¡Cada acierto te hace más grande, María!","¡María, tu esfuerzo está dando sus frutos!","¡Bravo, María! ¡Eres fantástica!","¡María, estás haciendo un trabajo excelente!","¡Qué lista eres, María! ¡Sigue practicando!","¡María, estás superándote a ti misma!","¡Genial, María! ¡Otro reto conseguido!","¡María, aprender contigo es una aventura!","¡Lo has vuelto a conseguir, María!","¡María, tienes un talento increíble!","¡Qué pasada, María! ¡Sigue adelante!","¡María, hoy estás imparable!","¡Sigue esforzándote, María! ¡Vas genial!","¡María, eres toda una experta!","¡Excelente, María! ¡Qué gran trabajo!","¡María, cada operación te sale mejor!","¡Estás brillando con luz propia, María!","¡María, tu cerebro está a toda velocidad!","¡Enhorabuena, María! ¡Lo estás consiguiendo!","¡María, qué bien resuelves los retos!","¡Sigue con esas ganas, María!","¡María, eres una pequeña genia!","¡Qué alegría verte aprender, María!","¡María, estás demostrando lo mucho que sabes!","¡Perfecto, María! ¡Vamos a por más!","¡María, tu esfuerzo merece un aplauso!","¡Lo estás haciendo de maravilla, María!","¡María, estás llena de talento!","¡Sensacional, María! ¡Otro desafío superado!","¡María, puedes conseguir cosas increíbles!","¡Qué orgullo, María! ¡Sigue creciendo!","¡María, estás conquistando las matemáticas!","¡Eres increíble, María! ¡Nunca dejes de aprender!"];

const previousMessageIndex={motivation:-1,continue:-1};
function randomMessage(items,type){let index=Math.floor(Math.random()*items.length);if(items.length>1&&index===previousMessageIndex[type])index=(index+1+Math.floor(Math.random()*(items.length-1)))%items.length;previousMessageIndex[type]=index;return items[index]}
$('celebrate').addEventListener('cancel',e=>{e.preventDefault();nextQuestion()});
let op='+',aDigits=1,bDigits=1,answer=0,correct=0,previous='',locked=false,timer=null;
const rand=(min,max)=>Math.floor(Math.random()*(max-min+1))+min;
const minD=d=>d===1?1:10**(d-1),maxD=d=>10**d-1;
function show(id){for(const k of ['home','setup','game'])$(k).classList.toggle('hidden',k!==id)}
function clearTimer(){if(timer!==null){clearTimeout(timer);timer=null}}
function configure(symbol){clearTimer();op=symbol;$('setupTitle').textContent=labels[op];$('hint').textContent=op==='÷'?'Solo divisiones exactas: sin restos ni decimales.':'';show('setup')}
document.querySelectorAll('[data-op]').forEach(el=>el.addEventListener('click',()=>configure(el.dataset.op)));
$('backHome').onclick=()=>{clearTimer();show('home')};$('backSetup').onclick=()=>{clearTimer();show('setup')};
function pair(){const aMin=minD(aDigits),aMax=maxD(aDigits),bMin=minD(bDigits),bMax=maxD(bDigits);let a,b;
if(op==='÷'){
 // Select a divisor and quotient so that the dividend has exactly the requested number of digits.
 // If the chosen digit combination cannot produce a quotient of at least 1, the quotient is 0.
 const bUpper=Math.min(bMax,aMax);
 if(bMin>bUpper){return [0,rand(bMin,bMax),0,true]}
 for(let i=0;i<300;i++){b=rand(bMin,bUpper);let qMin=Math.max(1,Math.ceil(aMin/b)),qMax=Math.floor(aMax/b);if(qMin<=qMax){let q=rand(qMin,qMax);a=b*q;return [a,b,q,false]}}
 b=bMin;const q=Math.max(1,Math.ceil(aMin/b));a=b*q;return [a,b,q,false]
}
a=rand(aMin,aMax);b=rand(bMin,bMax);if(op==='−'&&b>a)[a,b]=[b,a];
return [a,b,op==='+'?a+b:op==='−'?a-b:a*b,false]}
function distractors(correctValue){const set=new Set([correctValue]);const magnitude=Math.max(3,Math.round(Math.abs(correctValue)*.17));let tries=0;while(set.size<3&&tries++<100){let step=rand(1,magnitude);let candidate=correctValue+(Math.random()<.5?-step:step);if(candidate>=0)set.add(candidate)}while(set.size<3)set.add(correctValue+set.size);return [...set].sort(()=>Math.random()-.5)}
function nextQuestion(){clearTimer();locked=false;if($('celebrate').open)$('celebrate').close();$('feedback').textContent='';$('feedback').className='feedback';let a,b,c,zeroOnly=false,key;for(let i=0;i<50;i++){[a,b,c,zeroOnly]=pair();key=`${op}:${a}:${b}`;if(key!==previous)break}previous=key;answer=c;$('question').innerHTML=`<small>¿Cuánto es...?</small>${a.toLocaleString('es-ES')} ${op} ${b.toLocaleString('es-ES')} = ?`;$('answers').replaceChildren();for(const value of distractors(c)){const btn=document.createElement('button');btn.className='answer';btn.textContent=value.toLocaleString('es-ES');btn.onclick=()=>select(value,btn);$('answers').append(btn)} }
function select(value,selected){if(locked)return;locked=true;const ok=value===answer;document.querySelectorAll('.answer').forEach(b=>{b.disabled=true;if(b.textContent===answer.toLocaleString('es-ES'))b.classList.add('correct')});if(ok){correct++;$('score').textContent=`✓ ${correct} aciertos`;$('feedback').classList.add('ok');$('feedback').textContent='¡Muy bien! ⭐'}else{selected.classList.add('wrong');$('feedback').classList.add('error');$('feedback').textContent=`La respuesta era ${answer.toLocaleString('es-ES')}. ¡A por la siguiente!`}
if(ok&&correct%5===0){timer=setTimeout(()=>{$('congrats').textContent=randomMessage(messages,'motivation');$('continue').textContent=randomMessage(continueMessages,'continue')+' →';$('celebrate').showModal();$('continue').focus();$('feedback').textContent='';timer=null},850)}else{timer=setTimeout(nextQuestion,ok?1050:2000)}}
$('start').onclick=()=>{aDigits=Number($('digitsA').value);bDigits=Number($('digitsB').value);if(op==='÷'&&aDigits<bDigits&&aDigits!==1){$('hint').textContent='Para divisiones exactas, el primer número debe tener al menos tantas cifras como el segundo. Cambia las cifras para empezar.';return}correct=0;previous='';$('score').textContent='✓ 0 aciertos';show('game');nextQuestion()};$('continue').onclick=nextQuestion;
})();
</script>
